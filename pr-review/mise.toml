[tools]
python = "3.14"
uv = "latest"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.install]
description = "Sync deps and symlink pr-review into ~/bin"
run = """
uv sync
mkdir -p "$HOME/bin"
ln -sf "$MISE_PROJECT_ROOT/bin/pr-review" "$HOME/bin/pr-review"
"""

[tasks.sync-vendor]
description = "Re-fetch the vendored golang-pro skill from upstream (REF=main)"
run = """
ref="${REF:-main}"
base="https://raw.githubusercontent.com/Jeffallan/claude-skills/$ref"
dir="$MISE_PROJECT_ROOT/vendor/golang-pro"
curl -fsSL -o "$dir/LICENSE" "$base/LICENSE"
curl -fsSL -o "$dir/SKILL.md" "$base/skills/golang-pro/SKILL.md"
for f in concurrency interfaces generics testing project-structure; do
  curl -fsSL -o "$dir/references/$f.md" "$base/skills/golang-pro/references/$f.md"
done
echo "Fetched from $ref. Read the diff, then update the commit, version, and date"
echo "in vendor/golang-pro/PROVENANCE.md — and golang.py's header if the rubric moves."
git -C "$MISE_PROJECT_ROOT" --no-pager diff --stat -- vendor/golang-pro
"""
